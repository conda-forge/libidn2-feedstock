{% set version = "2.3.8" %}

package:
  name: libidn2
  version: {{ version }}

source:
  # The gnu ftp server makes us fail on download many times...
  # The gitlab source doesn't contain the result of build which end up requiring
  # some automake tools to guess the version from git..
  url: https://ftp.gnu.org/gnu/libidn/libidn2-{{ version }}.tar.gz
  sha256: f557911bf6171621e1f72ff35f5b1825bb35b52ed45325dcdee931e5d3c0787a
  # url: https://gitlab.com/libidn/libidn2/-/archive/v{{ version }}/libidn2-v{{ version }}.tar.gz
  # sha256: 304933ffe87d7ed0288561983d3c63d128cda533ef1942ce2aa57876f30f2391

build:
  skip: true  # [win]
  number: 3
  run_exports:
    # _Amazing_ backwards compatibility so pin to major number:
    #    https://abi-laboratory.pro/tracker/timeline/libidn2/
    - {{ pin_subpackage('libidn2', min_pin='x', max_pin='x') }}

requirements:
  build:
    - gnuconfig  # [unix]
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - make
    - pkg-config
    - gettext-tools
  host:
    - libintl-devel  # [not linux]
    - libunistring

test:
  commands:
    - test -f "${PREFIX}/include/idn2.h"
    - test -f "${PREFIX}/lib/libidn2${SHLIB_EXT}"

about:
  home: https://www.gnu.org/software/libidn/#libidn2
  license: LGPL-2.0-only
  license_file: COPYING
  summary: Library for internationalized domain names (IDNA2008) support

extra:
  recipe-maintainers:
    - hmaarrfk
